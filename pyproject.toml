[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wc3studio"
version = "1.0.0"
description = "Browse, extract, convert and animate Warcraft III assets (MPQ / MDX / BLP)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "wc3studio" }]
keywords = ["warcraft", "warcraft3", "mpq", "mdx", "blp", "gltf", "obj", "game-assets"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "pillow>=9.0",
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
wc3studio = "wc3studio.cli:main"

[project.urls]
Homepage = "https://github.com/"

[tool.setuptools]
packages = ["wc3studio"]

[tool.setuptools.package-data]
wc3studio = ["vendor/*.dll", "vendor/*.txt"]
